# Local development dependencies.
#
# Ports are deliberately non-default: 5432 and 6379 are commonly already taken
# by other projects on a dev machine. Match .env.example if you change them.

services:
  postgres:
    image: postgres:16
    container_name: betterman-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betterman
    ports:
      - '5440:5432'
    volumes:
      - betterman-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: betterman-redis
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  betterman-pgdata:
